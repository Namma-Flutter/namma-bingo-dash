name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          cat > .env <<EOF
          QUESTIONS_COUNT=${{ secrets.QUESTIONS_COUNT }}
          ALLOW_REPETITIVE_PERSON_SCAN=${{ secrets.ALLOW_REPETITIVE_PERSON_SCAN }}
          ALLOW_SAME_USER_SCAN=${{ secrets.ALLOW_SAME_USER_SCAN }}
          EOF

      - name: Build web
        run: flutter build web --release --base-href /namma-bingo-dash/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
